description: >
  HopperFormat (beta) lays out Grasshopper selections and groups as a
  left-to-right dataflow. Tap F twice to format the selection, including nested
  groups, or tap F twice with nothing selected to format and tidy every group.
  It only moves objects, never changes group membership, and each run is one undo.
